name: Build & Push Docker (CI/CD)

on:
  # `httpd:2-alpine` is a moving base-image tag. Rebuild daily so upstream
  # Alpine/httpd security fixes reach both registries without a source commit.
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [ main ]
    paths-ignore:
      - 'docker-compose.yml'
      - '*.md'
      - .gitignore
      - .dockerignore
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docker-compose.yml'
      - '*.md'
      - .gitignore
      - .dockerignore
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # Required for uploading security scan results

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # Scan the checked-in repository for secrets and IaC/Dockerfile
    # misconfigurations. Runtime content fetched by init.sh is intentionally
    # out of scope for this image/repository security policy.
    - name: Run Trivy repository security scanner
      if: github.event_name != 'pull_request'
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        scanners: 'secret,misconfig'
        format: 'sarif'
        output: 'trivy-repository-security.sarif'
        exit-code: '0'  # Report findings in GitHub Security without blocking the image build.

    - name: Upload repository security results to GitHub Security
      if: github.event_name != 'pull_request'
      uses: github/codeql-action/upload-sarif@v4.39.1
      with:
        sarif_file: 'trivy-repository-security.sarif'
        category: 'repository-security-scan'

    - name: Docker Hub Meta
      id: meta
      uses: docker/metadata-action@v6  # Neueste
      with:
        images: |
          ghcr.io/${{ github.repository }}
          docker.io/${{ secrets.DOCKERHUB_USERNAME }}/5etools-docker
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=main,enable={{is_default_branch}}
          type=sha
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

    - name: Login GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login Docker Hub
      uses: docker/login-action@v4
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build & Push
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        platforms: linux/amd64, linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        pull: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Security scanning only on push (after image is available in registry)
    - name: Run Trivy vulnerability scanner
      if: github.event_name != 'pull_request'
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
      with:
        image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/5etools-docker@${{ steps.build.outputs.digest }}'
        format: 'sarif'
        output: 'trivy-results.sarif'
        # Keep vulnerabilities without an upstream fix visible at every severity.
        ignore-unfixed: false
        vuln-type: 'os,library'

        exit-code: '0'  # Don't fail build, just report

    - name: Upload Trivy results to GitHub Security
      if: github.event_name != 'pull_request'
      uses: github/codeql-action/upload-sarif@v4.39.1
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'container-scan'

    - name: Generate Trivy report summary
      if: github.event_name != 'pull_request'
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
      with:
        image-ref: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/5etools-docker:latest
        format: 'table'
        # Keep the job-log summary aligned with the all-severity SARIF scan.
        ignore-unfixed: false
        exit-code: '0'  # Findings stay visible in the report and SARIF upload.

